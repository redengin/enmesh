# Docker compose for web simulation

services:
  local-web:
    build:
      context: .
      dockerfile_inline: |
        FROM node:20-alpine AS base
        RUN npm install -g vite
        FROM base AS app
        WORKDIR /opt/enmesh-simulation
        # NOTE changes to package*.json will require a rebuild of the image
        COPY package*.json ./
        RUN npm install
        CMD ["npm","run","dev","--","--host","0.0.0.0"]
    ports:
      - "5173:5173"
    volumes:
      # mount the app live - so that vite can force update on changes
      - ./index.html:/opt/enmesh-simulation/index.html:ro
      - ./src:/opt/enmesh-simulation/src:ro