[package]
name = "common"
version = "0.1.0"
license = "MIT"
edition = "2024"
publish = false


[dependencies]
log = "*"

# embedded utils
#-------------------------------------------------------------------------------
static_cell = "*"
heapless = { version = "*", features = ["ufmt"] }
embedded-hal = "*"
embedded-hal-bus = "*"
embedded-graphics = "*"
embedded-layout = "*"
# embedded-storage = "*"
# critical-section = "*"
#-------------------------------------------------------------------------------

# use the embassay RTOS
#-------------------------------------------------------------------------------
embassy-executor = { version = "*", features = ["log"] }
embassy-time = { version = "*", features = ["log"] }
embassy-embedded-hal = "*"
embassy-sync = { version = "*", features = ["log"] }
embassy-futures = { version = "*", features = ["log"] }
embassy-usb = { version = "*", features = ["log"] }
#-------------------------------------------------------------------------------

# Hardware drivers
#-------------------------------------------------------------------------------
# provide LORA radio drivers
lora-modulation = { version = "*", features = ["serde"] }
lora-phy = "*"

# screen support
display-interface = "*"
# 0.96" OLED Screen
ssd1306 = "*"       # ssd1306 = { version = "*", features = ["async"] }
# e-ink screen
# FIXME no maintained drivers found

#-------------------------------------------------------------------------------

# provide BLE Host
#-------------------------------------------------------------------------------
trouble-host = { version = "*", features = [
    "log",
    "peripheral",
    "gatt",
    "central",                      # required for security feature // FIXME  this shouldn't be necessary
    "security",
    "derive",                       # provide macros
    "default-packet-pool-mtu-1024", # max out BLE MTU size to maximize bandwidth
]}
# provide dependencies of trouble-host
# trouble-host-rand_core = { package ="rand_core", version = "0.6" }
# trouble-host-embassy-sync = { package ="embassy-sync", version = "0.7.2" }
#-------------------------------------------------------------------------------

[features]
# FIXME not currently supported
defmt = []
