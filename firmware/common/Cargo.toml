[package]
name = "common"
version = "0.1.0"
license = "MIT"
edition = "2024"
publish = false


[dependencies]
log = "*"

# embedded utils
#-------------------------------------------------------------------------------
static_cell = "*"
heapless = { version = "*", features = ["ufmt"] }
embedded-hal = "*"
embedded-graphics = "*"
embedded-layout = "*"
# embedded-storage = "*"
# critical-section = "*"
#-------------------------------------------------------------------------------

# use the embassay RTOS
#-------------------------------------------------------------------------------
embassy-executor = { version = "*", features = ["log"] }
embassy-time = { version = "*", features = ["log"] }
embassy-embedded-hal = "*"
embassy-sync = { version = "*", features = ["log"] }
embassy-futures = { version = "*", features = ["log"] }
embassy-usb = { version = "*", features = ["log"] }
#-------------------------------------------------------------------------------

# Hardware drivers
#-------------------------------------------------------------------------------
# provide LORA radio drivers
lora-modulation = { version = "*", features = ["serde"] }
lora-phy = "*"

# 0.96" OLED Screen
# ssd1306 = { version = "*", features = ["async"] }
ssd1306 = "*"
display-interface = "*"
# display-interface-i2c = "*"
# display-interface-spi = "*"
#-------------------------------------------------------------------------------

# provide BLE Host
#-------------------------------------------------------------------------------
# rand_core = { version = "0.6", default-features = false }
trouble-host = { version = "*", features = [
    "derive",                       # provide macros
#    "serde",                        # support storing the BondInformation
    "default-packet-pool-mtu-1024", # max out BLE MTU size to maximize bandwidth
]}
# provide traits necessary for trouble-host
trouble-host-rand_core = { package ="rand_core", version = "0.6" }
# trouble-host-embassy-sync = { package ="embassy-sync", version = "0.7.2" }


